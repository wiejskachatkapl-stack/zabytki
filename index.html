<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#152319" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mapa atrakcji Polski" />
  <meta name="application-name" content="Mapa atrakcji Polski" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Mapa atrakcji Polski</title>

  <link rel="manifest" href="manifest.webmanifest?v=1018" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=1002" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=1002" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png?v=1002" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=1019" />
</head>
<body>
  <main class="start-screen" aria-label="Turystyczna mapa Polski">
    <div class="actions" aria-label="Menu główne">
      <button class="main-button" id="addButton" type="button">DODAJ</button>
      <button class="main-button" id="mapButton" type="button">MAPA</button>
      <button class="main-button main-button-my-places" id="myPlacesButton" type="button">MOJE MIEJSCA</button>
    </div>

    <div class="app-version" id="appVersion" aria-label="Wersja aplikacji">v1022</div>
  </main>

  <section class="add-screen" id="addScreen" aria-label="Dodaj miejsce" hidden>
    <div class="add-panel">
      <div class="add-header">
        <button class="add-back-button" id="addBackButton" type="button" aria-label="Wróć do ekranu startowego">← COFNIJ</button>
        <div class="add-title-wrap">
          <h1 class="add-title">Dodaj miejsce</h1>
          <div class="add-version" aria-hidden="true">v1022</div>
        </div>
      </div>

      <div class="add-content">
        <label class="field-label" for="placeName">Nazwa miejsca (opcjonalnie)</label>
        <input class="text-field" id="placeName" type="text" maxlength="100" autocomplete="off" placeholder="np. Zamek w Czorsztynie" />

        <div class="section-label">Sposób podania lokalizacji</div>
        <div class="location-methods" role="group" aria-label="Sposób podania lokalizacji">
          <button class="method-button is-active" id="manualMethodButton" type="button" data-method="manual">RĘCZNIE</button>
          <button class="method-button" id="autoMethodButton" type="button" data-method="auto">MOJA LOKALIZACJA</button>
        </div>

        <div class="coordinates-box" id="coordinatesBox">
          <div class="coordinate-field">
            <label class="field-label" for="latitudeInput">Szerokość geograficzna</label>
            <input class="text-field" id="latitudeInput" type="text" inputmode="decimal" autocomplete="off" placeholder="np. 49.4356" />
          </div>
          <div class="coordinate-field">
            <label class="field-label" for="longitudeInput">Długość geograficzna</label>
            <input class="text-field" id="longitudeInput" type="text" inputmode="decimal" autocomplete="off" placeholder="np. 20.3136" />
          </div>
        </div>

        <div class="auto-location-box" id="autoLocationBox" hidden>
          <button class="gps-add-button" id="gpsAddButton" type="button">
            <span class="gps-target" aria-hidden="true">◎</span>
            POBIERZ MOJĄ LOKALIZACJĘ
          </button>
          <div class="gps-result" id="gpsResult" role="status" aria-live="polite">Lokalizacja nie została jeszcze pobrana.</div>
        </div>

        <div class="section-label">Co to jest?</div>
        <div class="category-grid" id="categoryGrid" role="group" aria-label="Kategoria miejsca">
          <button class="category-button is-active" type="button" data-category="castle">
            <img src="assets/markers/castle.png?v=1006" alt="" aria-hidden="true" />
            <span>Zamek</span>
          </button>
          <button class="category-button" type="button" data-category="ruins">
            <img src="assets/markers/ruins.png?v=1006" alt="" aria-hidden="true" />
            <span>Ruiny</span>
          </button>
          <button class="category-button" type="button" data-category="museum">
            <img src="assets/markers/museum.png?v=1006" alt="" aria-hidden="true" />
            <span>Muzeum</span>
          </button>
          <button class="category-button" type="button" data-category="nature">
            <img src="assets/markers/nature.png?v=1006" alt="" aria-hidden="true" />
            <span>Pomnik przyrody</span>
          </button>
          <button class="category-button" type="button" data-category="pttk">
            <img src="assets/markers/pttk.png?v=1006" alt="" aria-hidden="true" />
            <span>Schronisko PTTK</span>
          </button>
        </div>

        <label class="field-label date-label" for="dateInput">Data dodania</label>
        <div class="date-field-wrap">
          <input class="date-field" id="dateInput" type="date" />
        </div>

        <div class="add-message" id="addMessage" role="status" aria-live="polite" hidden></div>

        <button class="save-place-button" id="savePlaceButton" type="button">ZAPISZ PUNKT</button>
      </div>
    </div>
  </section>

  <section class="edit-screen" id="editScreen" aria-label="Edytuj miejsce" hidden>
    <div class="edit-panel">
      <div class="edit-header">
        <button class="edit-back-button" id="editBackButton" type="button" aria-label="Wróć do mapy">← COFNIJ</button>
        <div class="edit-title-wrap">
          <h1 class="edit-title">Edytuj punkt</h1>
          <div class="edit-version" aria-hidden="true">v1022</div>
        </div>
      </div>

      <div class="edit-content">
        <label class="field-label" for="editPlaceName">Nazwa miejsca</label>
        <input class="text-field" id="editPlaceName" type="text" maxlength="100" autocomplete="off" />

        <div class="coordinates-box edit-coordinates-box">
          <div class="coordinate-field">
            <label class="field-label" for="editLatitudeInput">Szerokość geograficzna</label>
            <input class="text-field" id="editLatitudeInput" type="text" inputmode="decimal" autocomplete="off" />
          </div>
          <div class="coordinate-field">
            <label class="field-label" for="editLongitudeInput">Długość geograficzna</label>
            <input class="text-field" id="editLongitudeInput" type="text" inputmode="decimal" autocomplete="off" />
          </div>
        </div>

        <div class="section-label">Co to jest?</div>
        <div class="category-grid edit-category-grid" id="editCategoryGrid" role="group" aria-label="Kategoria miejsca">
          <button class="category-button edit-category-button" type="button" data-category="castle">
            <img src="assets/markers/castle.png?v=1006" alt="" aria-hidden="true" />
            <span>Zamek</span>
          </button>
          <button class="category-button edit-category-button" type="button" data-category="ruins">
            <img src="assets/markers/ruins.png?v=1006" alt="" aria-hidden="true" />
            <span>Ruiny</span>
          </button>
          <button class="category-button edit-category-button" type="button" data-category="museum">
            <img src="assets/markers/museum.png?v=1006" alt="" aria-hidden="true" />
            <span>Muzeum</span>
          </button>
          <button class="category-button edit-category-button" type="button" data-category="nature">
            <img src="assets/markers/nature.png?v=1006" alt="" aria-hidden="true" />
            <span>Pomnik przyrody</span>
          </button>
          <button class="category-button edit-category-button" type="button" data-category="pttk">
            <img src="assets/markers/pttk.png?v=1006" alt="" aria-hidden="true" />
            <span>Schronisko PTTK</span>
          </button>
        </div>

        <label class="field-label" for="editDateInput">Data dodania</label>
        <div class="date-field-wrap">
          <input class="date-field" id="editDateInput" type="date" />
        </div>

        <label class="field-label" for="editNoteInput">Wiadomość / notatka</label>
        <textarea class="note-field" id="editNoteInput" maxlength="2000" rows="5" placeholder="Tu możesz dopisać informacje o tym miejscu, np. co warto zobaczyć, godziny wejścia, własne uwagi..."></textarea>

        <div class="edit-message" id="editMessage" role="status" aria-live="polite" hidden></div>

        <div class="edit-actions">
          <button class="delete-place-button" id="deletePlaceButton" type="button">USUŃ PUNKT</button>
          <button class="save-edit-button" id="saveEditButton" type="button">ZAPISZ ZMIANY</button>
        </div>
      </div>
    </div>
  </section>

  <section class="map-screen" id="mapScreen" aria-label="Mapa Polski" hidden>
    <div id="map" class="map-container" aria-label="Interaktywna mapa OpenStreetMap"></div>
    <button class="map-back-button" id="mapBackButton" type="button" aria-label="Wróć do ekranu startowego">← COFNIJ</button>
    <div class="map-mode-badge" id="mapModeBadge" aria-live="polite">MAPA</div>

    <button class="map-location-button" id="mapLocationButton" type="button" aria-label="Wycentruj mapę na mojej lokalizacji" title="Wycentruj na mojej lokalizacji">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Zm0 5.5a1.75 1.75 0 1 1 0-3.5 1.75 1.75 0 0 1 0 3.5Z"/>
        <path d="M13 2.05V4.1a8.02 8.02 0 0 1 6.9 6.9h2.05v2H19.9a8.02 8.02 0 0 1-6.9 6.9v2.05h-2V19.9A8.02 8.02 0 0 1 4.1 13H2.05v-2H4.1A8.02 8.02 0 0 1 11 4.1V2.05h2ZM12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/>
      </svg>
      <span>WYCENTRUJ</span>
    </button>

    <button class="osm-refresh-button is-active" id="osmRefreshButton" type="button" aria-pressed="true" aria-label="Baza atrakcji włączona" title="Baza atrakcji: włączona">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3Z"/>
        <path d="M12 7a5 5 0 1 0 5 5h-2a3 3 0 1 1-3-3V7Z"/>
        <path d="M12 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/>
        <path d="M13 3h8v8h-2V6.41l-5.3 5.3-1.4-1.42L17.59 5H13V3Z"/>
      </svg>
      <span>BAZA <small id="osmButtonState">ON</small></span>
    </button>

    <button class="route-button" id="routeButton" type="button" aria-label="Zaplanuj trasę" title="Zaplanuj trasę">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm10 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/>
        <path d="M8 10h2.5a3.5 3.5 0 0 1 3.5 3.5V14h-2v-.5a1.5 1.5 0 0 0-1.5-1.5H8v-2Zm6 4h2v-3h-2v3Z"/>
      </svg>
      <span>TRASA</span>
    </button>

    <button class="proximity-button" id="proximityButton" type="button" aria-pressed="false" aria-label="Automatyczne śledzenie i alerty" title="Automatyczne śledzenie i alerty">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3Z"/>
        <path d="M12 7a5 5 0 1 0 5 5h-2a3 3 0 1 1-3-3V7Z"/>
        <path d="M12 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/>
        <path d="M13 3h8v8h-2V6.41l-5.3 5.3-1.4-1.42L17.59 5H13V3Z"/>
      </svg>
    </button>

    <div class="proximity-radius-wrap" id="proximityRadiusWrap">
      <label for="proximityRadius">Alert</label>
      <select id="proximityRadius" aria-label="Odległość ostrzegania o atrakcjach">
        <option value="5000" selected>5 km</option>
        <option value="10000">10 km</option>
        <option value="15000">15 km</option>
        <option value="20000">20 km</option>
      </select>
    </div>

    <section class="route-panel" id="routePanel" aria-label="Planowanie trasy" hidden>
      <div class="route-panel-head">
        <div>
          <strong>PLANUJ TRASĘ</strong>
          <span>Start: moja aktualna lokalizacja</span>
        </div>
        <button class="route-panel-close" id="routePanelClose" type="button" aria-label="Zamknij planowanie trasy">×</button>
      </div>
      <label class="route-label" for="routeDestinationInput">Cel podróży</label>
      <div class="route-search-row">
        <input id="routeDestinationInput" class="route-destination-input" type="search" maxlength="120" autocomplete="off" placeholder="np. Zamek w Malborku, Zakopane..." />
        <button id="routeSearchButton" class="route-search-button" type="button">SZUKAJ</button>
      </div>
      <div class="route-results" id="routeResults" role="list" aria-live="polite"></div>
      <div class="route-info" id="routeInfo" role="status" aria-live="polite" hidden></div>
      <button id="routeClearButton" class="route-clear-button" type="button" hidden>USUŃ TRASĘ</button>
      <div class="route-source">Trasa: OSRM / OpenStreetMap · wyszukiwanie celu: Nominatim</div>
    </section>

    <div class="osm-status" id="osmStatus" role="status" aria-live="polite" hidden></div>
    <div class="location-message" id="locationMessage" role="status" aria-live="polite" hidden></div>
    <div class="map-version" aria-hidden="true">v1022</div>
  </section>

  <aside class="nearby-alert" id="nearbyAlert" role="alertdialog" aria-live="assertive" aria-label="Atrakcja w pobliżu" hidden>
    <img class="nearby-alert-icon" id="nearbyAlertIcon" src="assets/markers/castle.png?v=1007" alt="" aria-hidden="true" />
    <div class="nearby-alert-copy">
      <div class="nearby-alert-kicker">ATRAKCJA W POBLIŻU</div>
      <strong class="nearby-alert-title" id="nearbyAlertTitle">Ciekawe miejsce</strong>
      <div class="nearby-alert-meta" id="nearbyAlertMeta"></div>
    </div>
    <div class="nearby-alert-actions">
      <button id="nearbyAlertShow" type="button">POKAŻ</button>
      <button id="nearbyAlertAdd" type="button">DODAJ</button>
      <button id="nearbyAlertDismiss" type="button">POMIŃ</button>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js?v=1022"></script>
</body>
</html>
